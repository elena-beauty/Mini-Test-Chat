<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/chat.css">
</head>
<body>
    <div class="chat-container">
        <div id="top-left" style="position: absolute; top: 10px; left: 10px; font-size: 20px;">
            Loading...
        </div>
        <button id="signout-button" class="signout-button">Sign Out</button>

        <div class="chat-history" id="chat-history"></div>
        <div class="chat-input">
            <div class="input-container">
                <input type="text" id="chat-input" placeholder="Type your message..." />
                <i id="file-input-icon" class="fas fa-paperclip"></i>
                <i id="record-voice-icon" class="fas fa-microphone"></i>
            </div>
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const fileInput = document.getElementById('file-input');
        const recordVoiceButton = document.getElementById('record-voice-button');

        const signoutButton = document.getElementById('signout-button');

        const accessToken = localStorage.getItem('access_token');
        if (!accessToken) {
            alert('You are not authenticated. Please log in.');
            window.location.href = '/static/login.html'; // Redirect to login page
        }

        const ws = new WebSocket(`ws://127.0.0.1:8000/ws?token=${accessToken}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const message = document.createElement('p');
            message.className = data.status === 'success' ? 'received' : 'error';
            message.textContent = data.message;
            chatHistory.appendChild(message);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        };

        let offset = 0;
        const limit = 5;
        let isLoading = false;
        async function fetchUserName() {
            try {
                const response = await fetch(`/me?token=${accessToken}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    throw new Error("Failed to fetch user details");
                }
                const data = await response.json();
                const userName = data.name || "User";
                document.getElementById("top-left").innerText = `Hi ${userName}, How are you?`;
            } catch (error) {
                console.error("Error fetching user details:", error);
                document.getElementById("top-left").innerText = "Hi User";
            }
        }
        fetchUserName();

        async function fetchChatHistory(limit = 5, offset = 0, appendToTop = false) {
            try {
                const response = await fetch(`http://127.0.0.1:8000/messages/?limit=${limit}&offset=${offset}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch chat history');
                }

                const data = await response.json();
                const messages = data.messages;

                messages.reverse().forEach((message) => {
                    const messageElement = document.createElement('p');
                    messageElement.className = message.is_bot ? 'received' : 'sent';
                    messageElement.textContent = message.content;

                    if (appendToTop) {
                        chatHistory.prepend(messageElement);
                    } else {
                        chatHistory.appendChild(messageElement);
                    }
                });

                if (!appendToTop) {
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }
            } catch (error) {
                console.error('Error fetching chat history:', error);
            } finally {
                isLoading = false; // Reset loading state
            }
        }

        fetchChatHistory(limit, offset);

        chatHistory.addEventListener('scroll', async () => {
            if (chatHistory.scrollTop === 0 && !isLoading) {
                isLoading = true;
                offset += limit;
                await fetchChatHistory(limit, offset, true);
            }
        });
        sendButton.addEventListener('click', () => {
            const message = chatInput.value.trim();
            if (message) {
                const payload = {
                    type: 'text',
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    message: message
                };
                const messageElement = document.createElement('p');
                messageElement.className = 'sent';
                messageElement.textContent = message;
                chatHistory.appendChild(messageElement);
                chatHistory.scrollTop = chatHistory.scrollHeight;

                ws.send(JSON.stringify(payload));
                chatInput.value = '';
            }
        });

        chatInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendButton.click();
            }
        });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    const payload = {
                        type: 'video',
                        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                        message: reader.result
                    };
                    const messageElement = document.createElement('p');
                    messageElement.className = 'sent';
                    messageElement.textContent = `Video: ${file.name}`;
                    chatHistory.appendChild(messageElement);
                    chatHistory.scrollTop = chatHistory.scrollHeight;

                    ws.send(JSON.stringify(payload));
                };
                reader.readAsDataURL(file);
            }
        });

        let mediaRecorder;
        let audioChunks = [];

        recordVoiceButton.addEventListener('click', async () => {
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        const payload = {
                            user_id: 3,
                            type: 'voice',
                            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                            message: reader.result // Base64 encoded audio
                        };
                        const messageElement = document.createElement('p');
                        messageElement.className = 'sent';
                        messageElement.textContent = 'Voice message sent';
                        chatHistory.appendChild(messageElement);
                        chatHistory.scrollTop = chatHistory.scrollHeight;

                        ws.send(JSON.stringify(payload));
                    };
                    reader.readAsDataURL(audioBlob);
                    audioChunks = [];
                };

                mediaRecorder.start();
                recordVoiceButton.textContent = 'Stop';
            } else if (mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                recordVoiceButton.textContent = 'Voice';
            }
        });

        signoutButton.addEventListener('click', () => {
            localStorage.removeItem('access_token');
            window.location.href = '/static/login.html';
        });
    </script>
</body>
</html>
