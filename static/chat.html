<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/chat.css">
</head>
<body>
    <div class="chat-container">
        <div id="top-left" style="position: absolute; top: 10px; left: 10px; font-size: 20px;">
            Loading...
        </div>
        <button id="signout-button" class="signout-button">Sign Out</button>

        <div class="chat-history" id="chat-history" style="overflow-y: auto; height: 80vh;"></div>
        <div class="chat-input">
            <div class="input-container">
                <input type="text" id="chat-input" placeholder="Type your message..." />
                <i id="file-input-icon" class="fas fa-paperclip"></i>
                <i id="record-voice-icon" class="fas fa-microphone"></i>
            </div>
            <button id="send-button">Send</button>
        </div>
    </div>

    <script type="module">
        import { fetchChatHistory, fetchUserName } from './chatUtils.js';

        const chatHistory = document.getElementById('chat-history');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const signoutButton = document.getElementById('signout-button');

        const accessToken = localStorage.getItem('access_token');
        if (!accessToken) {
            alert('You are not authenticated. Please log in.');
            window.location.href = '/static/login.html'; // Redirect to login page
        }

        const ws = new WebSocket(`ws://127.0.0.1:8000/ws?token=${accessToken}`);

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const message = document.createElement('p');
            message.className = data.status === 'success' ? 'received' : 'error';
            message.textContent = data.message;
            chatHistory.appendChild(message);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        };

        let offset = 0;
        const limit = 10;
        let isLoading = false;

        // Fetch initial chat history
        const loadInitialMessages = async () => {
            await fetchChatHistory(limit, offset, accessToken, chatHistory, false);
            chatHistory.scrollTop = chatHistory.scrollHeight; // Scroll to the bottom initially
        };

        loadInitialMessages();

        // Fetch user name
        fetchUserName(accessToken).then((userName) => {
            document.getElementById('top-left').textContent = `Welcome, ${userName}`;
        });

        // Scroll event listener to fetch more messages when scrolling to the top
        chatHistory.addEventListener('scroll', async () => {
            // Check if the user is close to the top of the chat history
            if (chatHistory.scrollTop <= 200 && !isLoading) {
                isLoading = true;
                offset += limit;
                await fetchChatHistory(limit, offset, accessToken, chatHistory, true);
                isLoading = false;
            }
        });

        // Send message logic
        sendButton.addEventListener('click', () => {
            const message = chatInput.value.trim();
            if (message) {
                const payload = {
                    type: 'text',
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    message: message
                };
                const messageElement = document.createElement('p');
                messageElement.className = 'sent';
                messageElement.textContent = message;
                chatHistory.appendChild(messageElement);
                chatHistory.scrollTop = chatHistory.scrollHeight;

                ws.send(JSON.stringify(payload));
                chatInput.value = '';
            }
        });

        chatInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendButton.click();
            }
        });

        // Sign out logic
        signoutButton.addEventListener('click', () => {
            localStorage.removeItem('access_token');
            window.location.href = '/static/login.html';
        });
    </script>
</body>
</html>
